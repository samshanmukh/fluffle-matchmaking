<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #f3eee4;
        --ink: #1c1b19;
        --muted: #6b665c;
        --card: #fffdf8;
        --line: #d9d2c3;
        --accent: #5b3df5;
        --en: #2f5bea;
        --es: #e4572e;
        --fr: #1e8e5a;
        --ready: #1e8e5a;
        --declined: #c23b22;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        font-family: Inter, sans-serif;
        color: var(--ink);
      }
      #ground {
        position: absolute;
        inset: 0;
        background: var(--ground);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="65"
      data-width="1920"
      data-height="1080"
    >
      <div id="ground"></div>
      <div
        id="pairing"
        data-composition-id="pairing"
        data-composition-src="compositions/pairing.html"
        data-start="0"
        data-duration="40"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="rejoin"
        data-composition-id="rejoin"
        data-composition-src="compositions/rejoin.html"
        data-start="40"
        data-duration="25"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
