  <script>
    const tl = gsap.timeline({ paused: true });

    const TOP = 328;
    const LOW = 660;
    // Where each person stands at each stage (x; y is TOP or LOW).
    const queue = { finn: 206, chloe: 424, ana: 642, emi: 860, ben: 1078, dev: 1296, gus: 1514 };
    const group = { finn: 194, ana: 404, ben: 614, chloe: 848, dev: 1058, emi: 1292, gus: 1526 };
    const pair = { chloe: 252, dev: 460, ana: 756, ben: 964, finn: 1260, emi: 1468 };
    const left = { finn: 440, emi: 840, gus: 1240 };
    const order = ["finn", "chloe", "ana", "emi", "ben", "dev", "gus"];

    // Track each card's position so every move is an explicit fromTo (seek-safe).
    const pos = {};
    order.forEach((id) => {
      pos[id] = { x: queue[id], y: TOP };
    });
    const move = (id, x, y, at, dur = 0.8) => {
      tl.fromTo(
        "#c-" + id,
        { x: pos[id].x, y: pos[id].y },
        { x, y, duration: dur, ease: "power3.inOut", immediateRender: false },
        at,
      );
      pos[id] = { x, y };
    };
    const show = (sel, at, dur = 0.35) =>
      tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: dur, ease: "power2.out", immediateRender: false }, at);
    const hide = (sel, at, dur = 0.25) =>
      tl.fromTo(sel, { opacity: 1 }, { opacity: 0, duration: dur, ease: "power2.in", immediateRender: false }, at);

    // Everything except the first header and the cards' entrance starts hidden.
    gsap.set(
      ".frame, .glabel, .conn, .reason, .call, .status, #h1-in, #h2-in, #h3-in, #h4-in, #h5-in, #h6-in, #h7-in, #h8-k, #h8-s, .h8w, .algo-in:not(#a0-in)",
      { opacity: 0 },
    );

    // Headers: blur in, fade out just before the slot ends.
    const headers = [
      ["#h0-in", 0, 4.5],
      ["#h1-in", 4.5, 9.5],
      ["#h2-in", 9.5, 14.5],
      ["#h3-in", 14.5, 20],
      ["#h4-in", 20, 23],
      ["#h5-in", 23, 27.5],
      ["#h6-in", 27.5, 31],
      ["#h7-in", 31, 35],
      ["#a0-in", 0, 4.5],
      ["#a1-in", 4.5, 9.5],
      ["#a2-in", 9.5, 14.5],
      ["#a3-in", 14.5, 20.0],
      ["#a4-in", 20, 23],
      ["#a5-in", 23, 27.5],
      ["#a6-in", 27.5, 31.0],
      ["#a7-in", 31, 35],
    ];
    headers.forEach(([sel, start, end]) => {
      // The first header is already on screen at frame 0 (it is the thumbnail).
      if (start > 0) {
        tl.fromTo(
          sel,
          { opacity: 0, filter: "blur(8px)" },
          { opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "power2.out", immediateRender: false },
          start + 0.05,
        );
      }
      tl.fromTo(
        sel,
        { opacity: 1 },
        { opacity: 0, duration: 0.2, ease: "power2.in", immediateRender: false },
        end - 0.22,
      );
    });

    // 0s — seven people arrive in the queue, longest wait first.
    order.forEach((id, i) => {
      gsap.set("#c-" + id, { x: queue[id], y: TOP + 40, opacity: 0 });
      tl.fromTo(
        "#c-" + id,
        { y: TOP + 40, opacity: 0 },
        { y: TOP, opacity: 1, duration: 0.6, ease: "expo.out", immediateRender: false },
        0.5 + i * 0.1,
      );
    });

    // 4.5s — step 1: group by exact language set.
    ["finn", "ana", "ben", "chloe", "dev", "emi", "gus"].forEach((id, i) => {
      move(id, group[id], TOP, 5.1 + i * 0.05);
    });
    show("#g-en, #g-enes, #g-enfr, #g-fr", 5.9);
    show("#gl-en, #gl-enes, #gl-enfr, #gl-fr", 6.0);

    // 9.5s — step 2a: the partner request lifts the EN+ES pair to the top.
    hide("#gl-enes", 10.1);
    show("#gl-enes-hot", 10.2);
    tl.fromTo(
      "#g-enes",
      { borderColor: "#d9d2c3", backgroundColor: "rgba(91,61,245,0)" },
      {
        borderColor: "#5b3df5",
        backgroundColor: "rgba(91,61,245,0.08)",
        duration: 0.4,
        ease: "power2.inOut",
        immediateRender: false,
      },
      10.2,
    );
    move("chloe", pair.chloe, LOW, 11.9);
    move("dev", pair.dev, LOW, 11.96);
    hide("#g-enes, #gl-enes-hot", 11.9);
    show("#r1", 12.6);
    show("#l1", 12.85);

    // 14.5s — step 2b: shared topic beats the longer wait.
    tl.fromTo(
      "#t-ana, #t-ben",
      { color: "#1c1b19", scale: 1 },
      { color: "#5b3df5", scale: 1.12, duration: 0.4, ease: "back.out(1.6)", immediateRender: false },
      15.3,
    );
    move("ana", pair.ana, LOW, 16.2);
    move("ben", pair.ben, LOW, 16.26);
    show("#r2", 16.9);
    show("#l2", 17.15);

    // 20s — step 3: leftovers pair on any shared language.
    hide("#g-en, #g-enfr, #g-fr, #gl-en, #gl-enfr, #gl-fr", 20.1);
    move("finn", left.finn, TOP, 20.3);
    move("emi", left.emi, TOP, 20.36);
    move("gus", left.gus, TOP, 20.42);
    show("#k1", 21.2);
    show("#k2", 21.6);

    // 23s — Emi could go either way; the longer wait wins.
    tl.fromTo(
      "#w-finn",
      { color: "#6b665c", fontWeight: 400 },
      { color: "#5b3df5", fontWeight: 700, duration: 0.3, ease: "power2.out", immediateRender: false },
      23.5,
    );
    hide("#k1, #k2", 24.2);
    move("finn", pair.finn, LOW, 24.4);
    move("emi", pair.emi, LOW, 24.46);
    show("#r3", 25.1);
    show("#l3", 25.35);

    // 27.5s — the offer: everyone answers within 15 seconds.
    [
      ["chloe", 28.4],
      ["dev", 28.7],
      ["ana", 29.0],
      ["ben", 29.2],
      ["finn", 29.6],
      ["emi", 30.0],
    ].forEach(([id, at]) => {
      tl.fromTo(
        "#s-" + id,
        { opacity: 0, scale: 0.8 },
        { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.8)", immediateRender: false },
        at,
      );
    });
    hide("#l1, #l2", 30.2);
    show("#l1b, #l2b", 30.4);

    // 31s — decline: Emi leaves, Finn returns to the front.
    hide("#c-emi", 31.6, 0.5);
    hide("#r3, #l3, #s-finn", 31.6);
    move("finn", 194, TOP, 32.0, 0.9);

    // 35s — the rule in one line.
    show("#h8-k", 35.05, 0.3);
    show("#a8-in", 35.05, 0.3);
