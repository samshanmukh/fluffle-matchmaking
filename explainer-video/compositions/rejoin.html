  <script>
    const tl = gsap.timeline({ paused: true });

    const TOP = 328;
    const LOW = 660;
    const pos = {
      carl: { x: 660, y: TOP },
      ana: { x: 756, y: LOW },
      ben: { x: 964, y: LOW },
    };
    const move = (id, x, y, at, dur = 0.8) => {
      tl.fromTo(
        "#rj-c-" + id,
        { x: pos[id].x, y: pos[id].y },
        { x, y, duration: dur, ease: "power3.inOut", immediateRender: false },
        at,
      );
      pos[id] = { x, y };
    };
    const show = (sel, at, dur = 0.35) =>
      tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: dur, ease: "power2.out", immediateRender: false }, at);
    const hide = (sel, at, dur = 0.25) =>
      tl.fromTo(sel, { opacity: 1 }, { opacity: 0, duration: dur, ease: "power2.in", immediateRender: false }, at);

    // Starting states.
    Object.keys(pos).forEach((id) => gsap.set("#rj-c-" + id, { x: pos[id].x, y: pos[id].y, opacity: 0 }));
    gsap.set(
      "#rj-h1-in, #rj-h2-in, #rj-h3-in, #rj-h4-in, #rj-h5-in, .rj-badge, .rj-row, #rj-live, #rj-ended, #rj-r, #rj-l, #rj-wa-wait, #rj-wb-wait, .rj-algo-in",
      { opacity: 0 },
    );

    // Headers: blur in, fade out just before the slot ends (the last one stays).
    [
      ["#rj-h1-in", 0, 4.5],
      ["#rj-h2-in", 4.5, 9.5],
      ["#rj-h3-in", 9.5, 15],
      ["#rj-h4-in", 15, 20],
      ["#rj-h5-in", 20, null],
      ["#rj-a1-in", 0, 4.5],
      ["#rj-a2-in", 4.5, 9.5],
      ["#rj-a3-in", 9.5, 15.0],
      ["#rj-a4-in", 15, 20],
      ["#rj-a5-in", 20, null],
    ].forEach(([sel, start, end]) => {
      tl.fromTo(
        sel,
        { opacity: 0, filter: "blur(8px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "power2.out", immediateRender: false },
        start + 0.05,
      );
      if (end !== null) {
        tl.fromTo(
          sel,
          { opacity: 1 },
          { opacity: 0, duration: 0.2, ease: "power2.in", immediateRender: false },
          end - 0.22,
        );
      }
    });

    // 0s — Ana and Ben are on a call; Carl waits.
    show("#rj-c-carl, #rj-c-ana, #rj-c-ben", 0.1, 0.4);
    show("#rj-live", 0.3);
    hide("#rj-live", 2.3);
    show("#rj-ended", 2.5);

    // 4.5s — both rejoin; the server numbers each join as it arrives.
    hide("#rj-ended", 5.1);
    move("ana", 900, TOP, 5.3);
    hide("#rj-wa-call", 5.9);
    show("#rj-wa-wait", 6.1);
    show("#rj-b-ana", 6.2);
    move("ben", 1140, TOP, 6.6);
    hide("#rj-wb-call", 7.2);
    show("#rj-wb-wait", 7.4);
    show("#rj-b-ben", 7.5);

    // 9.5s — the three candidate pairs, best first.
    show("#rj-row1", 10.2);
    show("#rj-row2", 10.9);
    show("#rj-row3", 11.9);

    // 15s — the tie-break: the other person's wait.
    tl.fromTo(
      "#rj-x1, #rj-x2",
      { color: "#1c1b19" },
      { color: "#5b3df5", duration: 0.3, ease: "power2.out", immediateRender: false },
      15.6,
    );
    tl.fromTo(
      "#rj-row1",
      { backgroundColor: "rgba(91,61,245,0)" },
      { backgroundColor: "rgba(91,61,245,0.12)", duration: 0.4, ease: "power2.inOut", immediateRender: false },
      16.0,
    );
    hide("#rj-row1, #rj-row2, #rj-row3, #rj-b-ana", 17.3);
    move("carl", 756, LOW, 17.6);
    move("ana", 964, LOW, 17.66);
    show("#rj-r", 18.3);
    show("#rj-l", 18.55);

    // 20s — Ben waits at the front.
    hide("#rj-b-ben", 20.4);
    move("ben", 660, TOP, 20.6, 0.9);

    window.__timelines["rejoin"] = tl;
  </script>
