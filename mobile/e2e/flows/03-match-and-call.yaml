# partner: --answer ready --delay 1500
# Both say ready: the offer with both regions, then the call with the agreed language, then ending it.
appId: ${APP_ID}
---
- runFlow: ../shared/open.yaml
- tapOn:
    text: "Find a match"
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: "Say hi to"
    timeout: 20000
- assertVisible: ${PARTNER}
- assertVisible: ".*to answer"
# The scripted partner connects from Brazil.
- assertVisible: "Brazil"
- takeScreenshot: 03-offer
- tapOn:
    text: "I'm ready"
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: "On a call.*"
    timeout: 15000
- assertVisible: ${PARTNER}
- assertVisible: "English"
- assertVisible: "Brazil"
- assertVisible: "End call"
- takeScreenshot: 03-call
- tapOn:
    text: "End call"
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: "Find a match"
    timeout: 10000
