# partner: --answer silent
# Nobody answers within the window: back to the start, with the reason.
appId: ${APP_ID}
---
- runFlow: ../shared/open.yaml
- tapOn:
    text: "Find a match"
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: "Say hi to"
    timeout: 20000
- extendedWaitUntil:
    visible: ".*You missed that match.*"
    timeout: 30000
- takeScreenshot: 06-timed-out
- tapOn:
    text: ".*You missed that match.*"
    retryTapIfNoChange: false
- assertNotVisible: ".*You missed that match.*"
