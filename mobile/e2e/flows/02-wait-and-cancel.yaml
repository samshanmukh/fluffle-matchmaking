# Nobody else is online: the waiting screen is honest about it and can be left at any time.
appId: ${APP_ID}
---
- runFlow: ../shared/open.yaml
- tapOn:
    text: "Find a match"
    retryTapIfNoChange: false
- assertVisible: "Finding you someone"
- assertVisible: ".*speaks English.*"
- assertVisible: "Stop looking"
- takeScreenshot: 02-waiting
- tapOn:
    text: "Stop looking"
    retryTapIfNoChange: false
- assertVisible: "Find a match"
- assertNotVisible: "Finding you someone"
